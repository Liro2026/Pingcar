<body>

<header>

PingCar Administrator

</header>

<nav>

<a onclick="showDashboard()">📊 Dashboard</a>

<a onclick="showUsers()">👥 Benutzer</a>

<a onclick="showEmail()">📧 E-Mail senden</a>

<a onclick="showPush()">🔔 Push-Benachrichtigungen</a>

</nav>

<main id="content">

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://uvmkhqzfsgvicacvgskf.supabase.co";
const SUPABASE_KEY = "sb_publishable_PlgGThtv9ZEpQgiag8Y7Gw_PvZwsij2";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_EMAIL = "lirim.salihu2017@gmail.com";
const content = document.getElementById("content");

async function requireAdmin() {
  const { data, error } = await db.auth.getSession();
  const session = data?.session;

  if (error || !session) {
    content.innerHTML = `
      <div class="card">
        <h2>Zugriff verweigert</h2>
        <p>Bitte zuerst als Administrator anmelden.</p>
      </div>
    `;
    return false;
  }

  const email = (session.user?.email || "").toLowerCase();

  if (email !== ADMIN_EMAIL.toLowerCase()) {
    await db.auth.signOut();
    content.innerHTML = `
      <div class="card">
        <h2>Zugriff verweigert</h2>
        <p>Dieser Bereich ist nur für den Administrator verfügbar.</p>
      </div>
    `;
    return false;
  }

  return true;
}

/*
  Liest page_visits in Seiten von 1000 Datensätzen.
  Damit wird nicht mehr nur das erste 1000er-Paket verwendet.
*/
async function loadAllVisits() {
  const PAGE_SIZE = 1000;
  const allVisits = [];
  let from = 0;

  while (true) {
    const { data, error } = await db
      .from("page_visits")
      .select("visitor_id, visited_at, country")
      .range(from, from + PAGE_SIZE - 1);

    if (error) throw error;

    const rows = data || [];
    allVisits.push(...rows);

    if (rows.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }

  return allVisits;
}

async function showDashboard() {

  if (!(await requireAdmin())) return;

  content.innerHTML = `
    <div class="statbox">

      <div class="stat">
        Benutzer
        <h3 id="userCount">...</h3>
      </div>

      <div class="stat">
        Fahrzeuge
        <h3 id="vehicleCount">...</h3>
      </div>

      <div class="stat">
        E-Mails
        <h3 id="emailCount">0</h3>
      </div>

      <div class="stat">
        Push
        <h3 id="pushCount">0</h3>
      </div>

      <div class="stat">
        Seitenbesuche
        <h3 id="visitCount">...</h3>
      </div>

      <div class="stat">
        Besucher heute
        <h3 id="todayVisitCount">...</h3>
      </div>

      <div class="stat">
        Besucher einzigartig
        <h3 id="uniqueVisitCount">...</h3>
      </div>

    </div>

    <div class="card">
      <h2>Willkommen</h2>
      <p>Willkommen im neuen PingCar Administrator.</p>
    </div>
  `;

  try {

    /* Benutzer */
    const { data: sessionData, error: sessionError } =
      await db.auth.getSession();

    if (sessionError || !sessionData.session) {
      throw new Error("Nicht eingeloggt");
    }

    const response = await fetch(
      "https://uvmkhqzfsgvicacvgskf.supabase.co/functions/v1/admin-users",
      {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + sessionData.session.access_token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({})
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Fehler beim Laden der Benutzer");
    }

    document.getElementById("userCount").textContent =
      (result.users || []).length;

    /* Fahrzeuge */
    const { count: vehicleCount, error: vehicleError } =
      await db
        .from("user_qr")
        .select("*", { count: "exact", head: true })
        .eq("active", true);

    if (vehicleError) {
      console.error("Fahrzeuge Fehler:", vehicleError);
      document.getElementById("vehicleCount").textContent = "0";
    } else {
      document.getElementById("vehicleCount").textContent =
        vehicleCount ?? 0;
    }

    /* Alle Seitenbesuche */
    const allVisits = await loadAllVisits();

    document.getElementById("visitCount").textContent =
      allVisits.length;

    /* Besuche heute */
    const now = new Date();

    const todayStart = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

    const todayEnd = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1
    );

    const todayVisits = allVisits.filter(visit => {
      const visitDate = new Date(visit.visited_at);
      return visitDate >= todayStart && visitDate < todayEnd;
    });

    document.getElementById("todayVisitCount").textContent =
      todayVisits.length;

    /* Einzigartige Besucher */
    const uniqueVisitors = new Set(
      allVisits
        .map(visit => visit.visitor_id)
        .filter(Boolean)
    );

    document.getElementById("uniqueVisitCount").textContent =
      uniqueVisitors.size;

  } catch (error) {

    console.error("Dashboard Fehler:", error);

    document.getElementById("userCount").textContent = "!";
    document.getElementById("vehicleCount").textContent = "!";
    document.getElementById("emailCount").textContent = "0";
    document.getElementById("pushCount").textContent = "0";
    document.getElementById("visitCount").textContent = "!";
    document.getElementById("todayVisitCount").textContent = "!";
    document.getElementById("uniqueVisitCount").textContent = "!";
  }
}

async function showUsers() {

  if (!(await requireAdmin())) return;

  content.innerHTML = `
    <div class="card">
      <h2>Benutzer</h2>
      <p>Benutzer werden geladen...</p>
    </div>
  `;

  const { data: sessionData, error: sessionError } =
    await db.auth.getSession();

  if (sessionError || !sessionData.session) {
    content.innerHTML = `
      <div class="card">
        <h2>Benutzer</h2>
        <p>Bitte zuerst als Administrator einloggen.</p>
      </div>
    `;
    return;
  }

  try {

    const response = await fetch(
      "https://uvmkhqzfsgvicacvgskf.supabase.co/functions/v1/admin-users",
      {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + sessionData.session.access_token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({})
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Fehler beim Laden der Benutzer");
    }

    const users = result.users || [];
    let rows = "";

    users.forEach(user => {

      const name =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        "-";

      const email = user.email || "-";

      const status = user.email_confirmed_at
        ? "Bestätigt"
        : "Nicht bestätigt";

      rows += `
        <tr>
          <td>${name}</td>
          <td>${email}</td>
          <td>${status}</td>
        </tr>
      `;
    });

    if (!rows) {
      rows = `
        <tr>
          <td colspan="3">Keine Benutzer gefunden.</td>
        </tr>
      `;
    }

    content.innerHTML = `
      <div class="card">
        <h2>Benutzer</h2>

        <input placeholder="Benutzer suchen..." id="userSearch">

        <table>
          <tr>
            <th>Name</th>
            <th>E-Mail</th>
            <th>Status</th>
          </tr>

          ${rows}

        </table>
      </div>
    `;

  } catch (error) {

    content.innerHTML = `
      <div class="card">
        <h2>Fehler</h2>
        <p>${error.message}</p>
      </div>
    `;
  }
}

async function showEmail() {

  if (!(await requireAdmin())) return;

  content.innerHTML = `
    <div class="card">
      <h2>E-Mail senden</h2>

      <input id="emailTo" placeholder="Empfänger">

      <label style="display:block;margin:10px 0;">
        <input type="checkbox" id="sendToAll">
        An alle bestätigten Benutzer senden
      </label>

      <input id="emailSubject" placeholder="Betreff">

      <textarea id="emailMessage" placeholder="Nachricht"></textarea>

      <button onclick="sendAdminEmail()">Senden</button>

      <div id="emailResult" style="margin-top:15px;"></div>
    </div>
  `;
}

async function sendAdminEmail() {

  if (!(await requireAdmin())) return;

  const to = document.getElementById("emailTo").value.trim();
  const subject = document.getElementById("emailSubject").value.trim();
  const message = document.getElementById("emailMessage").value.trim();
  const sendToAll = document.getElementById("sendToAll").checked;
  const result = document.getElementById("emailResult");

  if ((!to && !sendToAll) || !subject || !message) {
    result.innerHTML = "Bitte alle Felder ausfüllen.";
    return;
  }

  result.innerHTML = sendToAll
    ? "📨 E-Mails an alle Benutzer werden vorbereitet..."
    : "📨 E-Mail wird gesendet...";

  try {

    const {
      data: { session },
      error: sessionError
    } = await db.auth.getSession();

    if (sessionError || !session) {
      result.innerHTML = "Nicht eingeloggt.";
      return;
    }

    if (!sendToAll) {

      const { data, error } = await db.functions.invoke(
        "send-email",
        {
          body: {
            to: to,
            subject: subject,
            message: message
          }
        }
      );

      if (error) throw error;

      if (data?.error) {
        throw new Error(
          typeof data.error === "string"
            ? data.error
            : JSON.stringify(data.error)
        );
      }

      result.innerHTML = "✅ E-Mail wurde erfolgreich gesendet.";
      document.getElementById("emailMessage").value = "";
      return;
    }

    const {
      data: usersData,
      error: usersError
    } = await db.functions.invoke("admin-users");

    if (usersError) throw usersError;

    const users = usersData?.users || [];

    const emails = [
      ...new Set(
        users
          .map(user => user.email)
          .filter(email => email)
      )
    ];

    if (!emails.length) {
      result.innerHTML = "❌ Keine Benutzer mit E-Mail-Adresse gefunden.";
      return;
    }

    let sent = 0;
    let failed = 0;

    for (const email of emails) {

      try {

        const { data, error } = await db.functions.invoke(
          "send-email",
          {
            body: {
              to: email,
              subject: subject,
              message: message
            }
          }
        );

        if (error || data?.error) {
          failed++;
        } else {
          sent++;
        }

        result.innerHTML =
          `📨 Gesendet: ${sent} / ${emails.length}` +
          (failed ? ` | ❌ Fehler: ${failed}` : "");

      } catch (err) {
        failed++;
      }
    }

    result.innerHTML =
      `✅ Fertig: ${sent} von ${emails.length} E-Mails gesendet.` +
      (failed ? ` ❌ Fehler: ${failed}` : "");

    document.getElementById("emailMessage").value = "";

  } catch (error) {

    console.error("E-Mail Fehler:", error);

    result.innerHTML =
      "❌ Fehler: " +
      (error?.message || "E-Mail konnte nicht gesendet werden.");
  }
}

async function showPush() {

  if (!(await requireAdmin())) return;

  content.innerHTML = `
    <div class="card">

      <h2>Push-Benachrichtigung</h2>

      <textarea id="pushMessage" placeholder="Nachricht"></textarea>

      <button onclick="sendPush()">Push senden</button>

    </div>
  `;
}

async function sendPush() {

  if (!(await requireAdmin())) return;

  const message = document.getElementById("pushMessage").value.trim();

  if (!message) {
    alert("Bitte Nachricht eingeben.");
    return;
  }

  const { data, error } = await db
    .from("notifications")
    .insert([
      {
        message: message
      }
    ]);

  if (error) {
    console.error(error);
    alert("Fehler: " + error.message);
    return;
  }

  alert("Push gespeichert!");

  document.getElementById("pushMessage").value = "";
}

async function showStats() {

  if (!(await requireAdmin())) return;

  content.innerHTML = `
    <div class="statbox">

      <div class="stat">
        Seitenbesuche
        <h3 id="statsTotalVisits">...</h3>
      </div>

      <div class="stat">
        Besucher heute
        <h3 id="statsTodayVisits">...</h3>
      </div>

      <div class="stat">
        Einzigartige Besucher
        <h3 id="statsUniqueVisitors">...</h3>
      </div>

    </div>

    <div class="card">
      <h2>Statistik</h2>
      <p>Aktuelle PingCar Seitenbesuche</p>
    </div>
        <div class="card">
      <h2>🌍 Besucher nach Ländern</h2>
      <div id="countryStats">Wird geladen...</div>
    </div>
  `;

  try {

    const allVisits = await loadAllVisits();

    document.getElementById("statsTotalVisits").textContent =
      allVisits.length;

    const now = new Date();

    const todayStart = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

    const todayEnd = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1
    );

    const todayVisits = allVisits.filter(visit => {
      const visitDate = new Date(visit.visited_at);
      return visitDate >= todayStart && visitDate < todayEnd;
    });

    document.getElementById("statsTodayVisits").textContent =
      todayVisits.length;

    const uniqueVisitors = new Set(
      allVisits
        .map(visit => visit.visitor_id)
        .filter(Boolean)
    );

    document.getElementById("statsUniqueVisitors").textContent =
      uniqueVisitors.size;

  } catch (error) {

    console.error("Statistik Fehler:", error);

    document.getElementById("statsTotalVisits").textContent = "!";
    document.getElementById("statsTodayVisits").textContent = "!";
    document.getElementById("statsUniqueVisitors").textContent = "!";
    document.getElementById("statsUniqueVisitors").textContent =
  uniqueVisitors.size;
      const countryCounts = {};

    allVisits.forEach(visit => {
      if (visit.country) {
        countryCounts[visit.country] =
          (countryCounts[visit.country] || 0) + 1;
      }
    });

    console.log("Besucher nach Ländern:", countryCounts);
        const countryStats = document.getElementById("countryStats");

    countryStats.innerHTML = Object.entries(countryCounts)
      .sort((a, b) => b[1] - a[1])
      .map(([country, count]) => `<p>🌍 ${country}: <strong>${count}</strong></p>`)
      .join("");
  }
}

requireAdmin().then(isAdmin => {
  if (isAdmin) showDashboard();
});
</script>
