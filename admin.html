async function requireAdmin() {

  if (error || !session) {
    content.innerHTML = `
      <div class="card">
        <h2>Zugriff verweigert</h2>
        <p>Bitte zuerst als Administrator anmelden.</p>
      </div>
    `;
    return false;
  }

  const email = (session.user?.email || "").toLowerCase();

  if (email !== ADMIN_EMAIL.toLowerCase()) {
    await db.auth.signOut();
    content.innerHTML = `

}

/*
  Liest page_visits in Seiten von 1000 Datensätzen.
  Damit wird nicht mehr nur das erste 1000er-Paket verwendet.
*/
async function loadAllVisits() {
  const PAGE_SIZE = 1000;
  const allVisits = [];
  let from = 0;

  while (true) {
    const { data, error } = await db
      .from("page_visits")
      .select("visitor_id, visited_at, country")
      .range(from, from + PAGE_SIZE - 1);

    if (error) throw error;

    const rows = data || [];
    allVisits.push(...rows);

    if (rows.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }

  return allVisits;
}

function filterUserVehicles() {

  const search =
    document
      .getElementById("userVehicleSearch")
      .value
      .toLowerCase()
      .trim();

  const rows =
    document.querySelectorAll("#userVehicleRows tr");

  rows.forEach(row => {

    const text =
      row.textContent.toLowerCase();

    row.style.display =
      text.includes(search)
        ? ""
        : "none";
  });
}


function escapeAdminText(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function sendAdminEmail() {

  if (!(await requireAdmin())) return;

  const to = document.getElementById("emailTo").value.trim();
  const subject = document.getElementById("emailSubject").value.trim();
  const message = document.getElementById("emailMessage").value.trim();
  const sendToAll = document.getElementById("sendToAll").checked;
  const result = document.getElementById("emailResult");

  if ((!to && !sendToAll) || !subject || !message) {
    result.innerHTML = "Bitte alle Felder ausfüllen.";
    return;
  }

  result.innerHTML = sendToAll
    ? "📨 E-Mails an alle Benutzer werden vorbereitet..."
    : "📨 E-Mail wird gesendet...";

  try {

    const {
      data: { session },
      error: sessionError
    } = await db.auth.getSession();

    if (sessionError || !session) {
      result.innerHTML = "Nicht eingeloggt.";
      return;
    }

    if (!sendToAll) {

      const { data, error } = await db.functions.invoke(
        "send-email",
        {
          body: {
            to: to,
            subject: subject,
            message: message
          }
        }
      );

      if (error) throw error;

      if (data?.error) {
        throw new Error(
          typeof data.error === "string"
            ? data.error
            : JSON.stringify(data.error)
        );
      }

      result.innerHTML = "✅ E-Mail wurde erfolgreich gesendet.";
      document.getElementById("emailMessage").value = "";
      return;
    }

    const {
      data: usersData,
      error: usersError
    } = await db.functions.invoke("admin-users");

    if (usersError) throw usersError;

    const users = usersData?.users || [];

    const emails = [
      ...new Set(
        users
          .map(user => user.email)
          .filter(email => email)
      )
    ];

    if (!emails.length) {
      result.innerHTML = "❌ Keine Benutzer mit E-Mail-Adresse gefunden.";
      return;
    }

    let sent = 0;
    let failed = 0;

    for (const email of emails) {

      try {

        const { data, error } = await db.functions.invoke(
          "send-email",
          {
            body: {
              to: email,
              subject: subject,
              message: message
            }
          }
        );

        if (error || data?.error) {
          failed++;
        } else {
          sent++;
        }

        result.innerHTML =
          `📨 Gesendet: ${sent} / ${emails.length}` +
          (failed ? ` | ❌ Fehler: ${failed}` : "");

      } catch (err) {
        failed++;
      }
    }

    result.innerHTML =
      `✅ Fertig: ${sent} von ${emails.length} E-Mails gesendet.` +
      (failed ? ` ❌ Fehler: ${failed}` : "");

    document.getElementById("emailMessage").value = "";

  } catch (error) {

    console.error("E-Mail Fehler:", error);

    result.innerHTML =
      "❌ Fehler: " +
      (error?.message || "E-Mail konnte nicht gesendet werden.");
  }
}

  }

  const { data, error } = await db
    .from("notifications")
    .insert([
      {

        <h3 id="statsUniqueVisitors">...</h3>
      </div>

      <p>Aktuelle PingCar Seitenbesuche</p>
    </div>
        <div class="card">
      <h2>🌍 Besucher nach Ländern</h2>
      <div id="countryStats">Wird geladen...</div>
    </div>
  `;

  try {

    const allVisits = await loadAllVisits();

    document.getElementById("statsTotalVisits").textContent =
      allVisits.length;

    const now = new Date();

    const todayStart = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

    const todayEnd = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1
    );

    const todayVisits = allVisits.filter(visit => {
      const visitDate = new Date(visit.visited_at);
      return visitDate >= todayStart && visitDate < todayEnd;
    });

    document.getElementById("statsTodayVisits").textContent =
      todayVisits.length;

    const uniqueVisitors = new Set(
      allVisits
        .map(visit => visit.visitor_id)
        .filter(Boolean)
    );

    document.getElementById("statsUniqueVisitors").textContent =
      uniqueVisitors.size;
    const countryCounts = {};

    allVisits.forEach(visit => {
      if (visit.country) {
        countryCounts[visit.country] =
          (countryCounts[visit.country] || 0) + 1;
      }
    });

    console.log("Besucher nach Ländern:", countryCounts);

    const countryStats = document.getElementById("countryStats");

    countryStats.innerHTML = Object.entries(countryCounts)
      .sort((a, b) => b[1] - a[1])
      .map(([country, count]) => `<p>🌍 ${country}: <strong>${count}</strong></p>`)
      .join("");
  } catch (error) {

    console.error("Statistik Fehler:", error);

    document.getElementById("statsTotalVisits").textContent = "!";
    document.getElementById("statsTodayVisits").textContent = "!";
    document.getElementById("statsUniqueVisitors").textContent = "!";
    
  
    
  }

function escapeSupportText(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderSupportMessages(messages) {
  const tbody = document.getElementById("support-table-body");

  const total = messages.length;
  const unread = messages.filter(m => m.read !== true).length;

  document.getElementById("support-total").textContent = total;
  document.getElementById("support-unread").textContent = unread;

  if (total === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6" style="padding:15px; text-align:center; color:#666;">
          Keine Nachrichten vorhanden
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = messages.map(message => {

    const isRead = message.read === true;

    const date = message.created_at
      ? new Date(message.created_at).toLocaleString("de-CH")
      : "-";

    return `
      <tr style="border-bottom:1px solid #eee;">

        <td style="padding:10px;">
          <strong>${escapeSupportText(message.qr_code || "-")}</strong>
        </td>

        <td style="padding:10px;">
          ${escapeSupportText(message.message || "-")}
        </td>

        <td style="padding:10px; font-size:12px;">
          ${escapeSupportText(message.sender_id || "-")}
        </td>

        <td style="padding:10px; white-space:nowrap;">
          ${date}
        </td>

        <td style="padding:10px;">
          <span style="
            background:${isRead ? "#d4edda" : "#f8d7da"};
            color:${isRead ? "#155724" : "#721c24"};
            padding:4px 8px;
            border-radius:4px;
            font-size:12px;
            font-weight:bold;
          ">
            ${isRead ? "Gelesen" : "Neu"}
          </span>
        </td>

        <td style="padding:10px;">

          <button
            onclick="replyToSupportMessage(
              '${message.id}',
              '${escapeSupportText(message.conversation_id || "")}',
              '${escapeSupportText(message.sender_id || "")}',
              '${escapeSupportText(message.qr_code || "")}'
            )"
            style="
              background:#198754;
              color:white;
              border:none;
              padding:7px 12px;
              border-radius:5px;
              cursor:pointer;
              font-size:13px;
              margin-right:5px;
            "
          >
            💬 Antworten
          </button>

          ${
            isRead
              ? ""
              : `
                <button
                  onclick="markSupportMessageRead('${message.id}')"
                  style="
                    background:#0d6efd;
                    color:white;
                    border:none;
                    padding:7px 12px;
                    border-radius:5px;
                    cursor:pointer;
                    font-size:13px;
                  "
                >
                  ✓ Gelesen
                </button>
              `
          }

        </td>

      </tr>
    `;
  }).join("");
}

async function replyToSupportMessage(
  messageId,
  conversationId,
  receiverId,
  qrCode
) {

  const answer = prompt(
    "💬 Antwort auf diese Nachricht:"
  );

  if (answer === null) {
    return;
  }

  const text = answer.trim();

  if (!text) {
    alert("Bitte eine Nachricht eingeben.");
    return;
  }

  try {

    const {
      data: sessionData,
      error: sessionError
    } = await db.auth.getSession();

    if (sessionError || !sessionData.session) {
      alert("Nicht eingeloggt.");
      return;
    }

    const adminId =
      sessionData.session.user.id;


    /* Besitzer des QR-Codes finden */

    const {
      data: qrData,
      error: qrError
    } = await db
      .from("user_qr")
      .select("user_id")
      .eq("qr_code", qrCode)
      .eq("active", true)
      .maybeSingle();

    if (qrError) {

      console.error(
        "QR Besitzer Fehler:",
        qrError
      );

      alert(
        "Besitzer des QR-Codes konnte nicht gefunden werden:\n" +
        qrError.message
      );

      return;
    }

    if (!qrData?.user_id) {

      alert(
        "Kein Benutzer für diesen QR-Code gefunden."
      );

      return;
    }

    const ownerId = qrData.user_id;


    /* Antwort in messages speichern */

    const { error: messageError } = await db
      .from("messages")
      .insert({
        conversation_id: conversationId,
        sender_id: adminId,
        receiver_id: receiverId,
        qr_code: qrCode,
        message: text,
        read: false
      });

    if (messageError) {

      console.error(
        "Antwort Fehler:",
        messageError
      );

      alert(
        "Antwort konnte nicht gesendet werden:\n" +
        messageError.message
      );

      return;
    }


    /* Benachrichtigung für den Benutzer erstellen */

    const { error: notificationError } = await db
      .from("notifications")
      .insert({
        message: text,
        sender_id: adminId,
        owner_id: ownerId,
        qr_code: qrCode
      });

    if (notificationError) {

      console.error(
        "Benachrichtigung Fehler:",
        notificationError
      );

      alert(
        "Antwort wurde gesendet, aber die Benachrichtigung konnte nicht erstellt werden:\n" +
        notificationError.message
      );

      return;
    }


    /* ursprüngliche Nachricht als gelesen markieren */

    const { error: readError } = await db
      .from("messages")
      .update({ read: true })
      .eq("id", messageId);

    if (readError) {

      console.error(
        "Gelesen Fehler:",
        readError
      );
    }


    alert(
      "✅ Antwort wurde erfolgreich gesendet."
    );

    await showSupport();

  } catch (error) {

    console.error(
      "Support Antwort Fehler:",
      error
    );

    alert(
      "Fehler: " + error.message
    );

  }
}

      );

      userMap.set(user.id, user);

      deviceList.length;

    document.getElementById("deviceActive").textContent =
      deviceList.filter(device => device.fcm_token).length;

    document.getElementById("deviceInactive").textContent =

      const maskedToken = token
        ? token.substring(0, 12) + "••••••••"
        : "-";

        ? new Date(device.created_at).toLocaleString("de-CH")

  const content = document.getElementById("content");

  content.innerHTML = `
    <div class="card">
      <h2>🟢 Live Online</h2>

      <div style="
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:15px;

      ">

          <h2 id="onlineAndroid">0</h2>
        </div>

        <div style="background:#f8f9fa;padding:20px;border-radius:10px;text-align:center;">
          <small>🍎 iPhone</small>
          <h2 id="onlineIphone">0</h2>
        </div>

        <div style="background:#e8f5e9;padding:20px;border-radius:10px;text-align:center;">
          <small>🟢 Gesamt Online</small>
          <h2 id="onlineTotal">0</h2>
        </div>

      </div>

      <div style="margin-top:25px;">
        <h3>Aktive Verbindungen</h3>

        <table style="width:100%;">
          <thead>
            <tr>
              <th>Plattform</th>
              <th>Benutzer</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="onlineRows">
            <tr>
              <td colspan="3" style="text-align:center;">
                Warte auf Live-Verbindungen...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  `;

  let onlineChannel = window.pingcarOnlineChannel;

  if (onlineChannel) {
    try {
      await db.removeChannel(onlineChannel);
    } catch (e) {}
  }

  const session = await db.auth.getSession();

  const adminKey =
    "admin-" +
    (session?.data?.session?.user?.id || "admin");

  onlineChannel = db.channel("pingcar-online", {
    config: {
      presence: {
        key: adminKey
      }
    }
  });

  window.pingcarOnlineChannel = onlineChannel;

  onlineChannel.on("presence", { event: "sync" }, () => {
    updateOnlinePresence();
  });

  onlineChannel.on("presence", { event: "join" }, () => {
    updateOnlinePresence();
  });

  onlineChannel.on("presence", { event: "leave" }, () => {
    updateOnlinePresence();
  });

  onlineChannel.subscribe(async status => {

    if (status === "SUBSCRIBED") {

      await onlineChannel.track({
        platform: "admin",
        user_id: session?.data?.session?.user?.id || null
      });

      updateOnlinePresence();
    }

  });

  async function updateOnlinePresence() {

    const state = onlineChannel.presenceState();

    const connections = [];

    Object.entries(state).forEach(([key, presences]) => {

      presences.forEach(presence => {

        if (presence.platform === "admin") return;

        connections.push({
          key,
          ...presence
        });

      });

    });

    const website = connections.filter(
      x => x.platform === "website"
    ).length;

    const android = connections.filter(
      x => x.platform === "android"
    ).length;

    const iphone = connections.filter(
      x => x.platform === "iphone"
    ).length;

    document.getElementById("onlineWebsite").textContent =
      website;

    document.getElementById("onlineAndroid").textContent =
      android;

    document.getElementById("onlineIphone").textContent =
      iphone;

    document.getElementById("onlineTotal").textContent =
      connections.length;

    const rows = document.getElementById("onlineRows");

    if (connections.length === 0) {

      rows.innerHTML = `
        <tr>
          <td colspan="3" style="text-align:center;">
            Aktuell niemand online.
          </td>
        </tr>
      `;

      return;
    }

    rows.innerHTML = connections.map(connection => {

      let platform = "🌐 Website";

      if (connection.platform === "android") {
        platform = "🤖 Android";
      }

      if (connection.platform === "iphone") {
        platform = "🍎 iPhone";
      }

      return `
        <tr>
          <td>${platform}</td>
          <td>${connection.email || "Gast / Besucher"}</td>
          <td>
            <span style="
              background:#d4edda;
              color:#155724;
              padding:4px 8px;
              border-radius:5px;
              font-weight:bold;
            ">
              🟢 Online
            </span>
          </td>
        </tr>
      `;

    }).join("");
  }
}

      .from("error_logs")
      .select("id", { count: "exact", head: true });

    setStatus(
      "status-errors",

    );
  } catch (error) {

        </tbody>
      </table>
    </div>
  `;

  try {
const client = db;
    let { data: subs, error } = await client
      .from('subscriptions')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error("Supabase Error:", error);
      subs = [];
    }

    const tbody = document.getElementById("subs-table-body");
    
    if (!subs || subs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="padding: 10px; text-align: center; color: #666;">Keine Abonnements vorhanden</td></tr>`;
      document.getElementById("active-subs-count").textContent = "0";
      document.getElementById("mrr-amount").textContent = "CHF 0.00";
      return;
    }

    let activeCount = 0;
    let totalMRR = 0;

    const rows = subs.map(sub => {
      const isActive = sub.status === 'active';
      if (isActive) {
        activeCount++;
        totalMRR += Number(sub.amount || 0);
      }

      const expiryDate = sub.expires_at ? new Date(sub.expires_at).toLocaleDateString('de-CH') : 'Unbefristet';

      return `
        <tr style="border-bottom: 1px solid #eee;">
          <td style="padding: 10px;">${sub.email || 'Unbekannt'}</td>
          <td style="padding: 10px;">${sub.plan_name || 'Pro'}</td>
          <td style="padding: 10px;">
            <span style="background: ${isActive ? '#d4edda' : '#f8d7da'}; color: ${isActive ? '#155724' : '#721c24'}; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">
              ${sub.status || 'inactive'}
            </span>
          </td>
          <td style="padding: 10px;">${expiryDate}</td>
        </tr>
      `;
    }).join('');

    tbody.innerHTML = rows;
    document.getElementById("active-subs-count").textContent = activeCount;
    document.getElementById("mrr-amount").textContent = `CHF ${totalMRR.toFixed(2)}`;
  } catch (err) {
    console.error("JS Error:", err);
  }
}

requireAdmin().then(isAdmin => {
  if (isAdmin) showDashboard();
});
</script>

</body>
