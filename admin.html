<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingCar Administrator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f2f4f8;
}

header{
position:fixed;
top:0;
left:0;
right:0;
height:70px;
background:#111;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:bold;
z-index:1000;
}

nav{
position:fixed;
top:70px;
left:0;
width:240px;
bottom:0;
background:#1d1d1d;
overflow:auto;
}

nav a{
display:block;
padding:18px;
color:white;
text-decoration:none;
font-size:18px;
border-bottom:1px solid #333;
transition:.2s;
cursor:pointer;
}

nav a:hover{
background:#0d6efd;
}

main{
margin-left:240px;
margin-top:70px;
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

h2{
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
margin-top:10px;
margin-bottom:15px;
font-size:15px;
}

textarea{
height:180px;
resize:vertical;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:12px 22px;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#0b5ed7;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#0d6efd;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
}

.statbox{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:20px;
}

.stat{
background:white;
padding:25px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat h3{
font-size:40px;
margin-top:15px;
color:#0d6efd;
}

</style>

</head>

<body>

<header>

PingCar Administrator

</header>

<nav>

<a onclick="showDashboard()">📊 Dashboard</a>

<a onclick="showUsers()">👥 Benutzer</a>

<a onclick="showEmail()">📧 E-Mail senden</a>

<a onclick="showPush()">🔔 Push-Benachrichtigungen</a>

<a onclick="showStats()">📈 Statistik</a>

</nav>

<main id="content">

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://uvmkhqzfsgvicacvgskf.supabase.co";
const SUPABASE_KEY = "sb_publishable_PlgGThtv9ZEpQgiag8Y7Gw_PvZwsij2";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

console.log("Supabase u lidh me sukses!");
const content=document.getElementById("content");

function showDashboard(){

content.innerHTML=`

<div class="statbox">

<div class="stat">
Benutzer
<h3>0</h3>
</div>

<div class="stat">
Fahrzeuge
<h3>0</h3>
</div>

<div class="stat">
E-Mails
<h3>0</h3>
</div>

<div class="stat">
Push
<h3>0</h3>
</div>

</div>

<div class="card">

<h2>Willkommen</h2>

<p>Willkommen im neuen PingCar Administrator.</p>

</div>

`;

}

async function showUsers(){

  content.innerHTML = `
    <div class="card">
      <h2>Benutzer</h2>
      <p>Benutzer werden geladen...</p>
    </div>
  `;

  const { data: sessionData, error: sessionError } =
    await db.auth.getSession();

  if (sessionError || !sessionData.session) {
    content.innerHTML = `
      <div class="card">
        <h2>Benutzer</h2>
        <p>Bitte zuerst als Administrator einloggen.</p>
      </div>
    `;
    return;
  }

  try {

    const response = await fetch(
      "https://uvmkhqzfsgvicacvgskf.supabase.co/functions/v1/admin-users",
      {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + sessionData.session.access_token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({})
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Fehler beim Laden der Benutzer");
    }

    const users = result.users || [];

    let rows = "";

    users.forEach(user => {

      const name =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        "-";

      const email = user.email || "-";

      const status = user.email_confirmed_at
        ? "Bestätigt"
        : "Nicht bestätigt";

      rows += `
        <tr>
          <td>${name}</td>
          <td>${email}</td>
          <td>${status}</td>
        </tr>
      `;
    });

    if (!rows) {
      rows = `
        <tr>
          <td colspan="3">Keine Benutzer gefunden.</td>
        </tr>
      `;
    }

    content.innerHTML = `
      <div class="card">
        <h2>Benutzer</h2>

        <input placeholder="Benutzer suchen..." id="userSearch">

        <table>
          <tr>
            <th>Name</th>
            <th>E-Mail</th>
            <th>Status</th>
          </tr>

          ${rows}

        </table>
      </div>
    `;

  } catch (error) {

    content.innerHTML = `
      <div class="card">
        <h2>Fehler</h2>
        <p>${error.message}</p>
      </div>
    `;

  }
}

function showEmail(){

content.innerHTML=`

<div class="card">

<h2>E-Mail senden</h2>

<input placeholder="Betreff">

<textarea placeholder="Nachricht"></textarea>

<button>Senden</button>

</div>

`;

}

function showPush(){

    content.innerHTML = `

    <div class="card">

        <h2>Push-Benachrichtigung</h2>

        <textarea id="pushMessage" placeholder="Nachricht"></textarea>

        <button onclick="sendPush()">Push senden</button>

    </div>

    `;

}

async function sendPush(){

    const message = document.getElementById("pushMessage").value.trim();

    if(!message){
        alert("Bitte Nachricht eingeben.");
        return;
    }

    const { data, error } = await db
        .from("notifications")
        .insert([
            {
                message: message
            }
        ]);

    if(error){
        console.error(error);
        alert("Fehler: " + error.message);
        return;
    }

    alert("Push gespeichert!");

    document.getElementById("pushMessage").value = "";

}

function showStats(){

content.innerHTML=`

<div class="card">

<h2>Statistik</h2>

<p>Statistiken erscheinen hier.</p>

</div>

`;

}

showDashboard();

</script>

</body>

</html>
