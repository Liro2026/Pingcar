format_version: '13'

default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

project_type: ios

workflows:
  build:
    title: PingCar iOS Build
    description: PingCar iOS App Store Build

    steps:

    - git-clone@8: {}

    - script@1:
        title: Prepare PingCar iOS
        inputs:
        - content: |-
            #!/bin/bash
            set -e

            echo "=== Copying local www directly to iOS ==="
            IOS_PUBLIC="ios/App/App/public"
            rm -rf "$IOS_PUBLIC"
            mkdir -p "$IOS_PUBLIC"
            cp -R "www/." "$IOS_PUBLIC/"

            echo "=== Restoring Storyboard files for Xcode ==="
            BASE_LPROJ="ios/App/App/Base.lproj"

            if [ -f "$BASE_LPROJ/Main.storyboard.xml" ]; then
              cp "$BASE_LPROJ/Main.storyboard.xml" "$BASE_LPROJ/Main.storyboard"
              echo "Main.storyboard restored."
            fi

            if [ -f "$BASE_LPROJ/LaunchScreen.storyboard.xml" ]; then
              cp "$BASE_LPROJ/LaunchScreen.storyboard.xml" "$BASE_LPROJ/LaunchScreen.storyboard"
              echo "LaunchScreen.storyboard restored."
            fi

            echo "=== Setting Build Number 58 ==="
            PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"
            APP_VERSION=$(node -p "require('./package.json').version")

            sed -i '' -E \
              's/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = 58;/g' \
              "$PROJECT_FILE"

            sed -i '' -E \
              "s/MARKETING_VERSION = [^\";]+;/MARKETING_VERSION = ${APP_VERSION};/g" \
              "$PROJECT_FILE"

            echo "Done! Preparation complete."

    - manage-ios-code-signing@2:
        inputs:
        - apple_service_connection: api-key
        - distribution_method: app-store
        - project_path: ios/App/App.xcodeproj
        - scheme: App
        - sign_uitest_targets: 'no'
        - register_test_devices: 'no'

    - xcode-archive@6:
        inputs:
        - project_path: ios/App/App.xcodeproj
        - scheme: App
        - distribution_method: app-store
        - automatic_code_signing: api-key
        - register_test_devices: 'no'
        - testflight_internal_testing_only: 'no'
        - export_all_dsyms: 'yes'
        - output_dir: "$BITRISE_DEPLOY_DIR"

    - deploy-to-bitrise-io@2: {}

    - deploy-to-itunesconnect-deliver@2:
        inputs:
        - connection: api_key
        - ipa_path: "$BITRISE_IPA_PATH"
        - bundle_id: ch.pingcar.app

meta:
  bitrise.io:
    stack: osx-xcode-latest-stable
