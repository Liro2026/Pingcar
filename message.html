<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PingCar - Nachricht senden</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6fb;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    border-radius:15px;
    padding:35px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#1877f2;
    font-size:38px;
}

.logo p{
    color:#666;
    margin-top:10px;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    resize:vertical;
    min-height:140px;
}

input[type=file]{
    border:none;
    padding:0;
    margin-top:10px;
}

button{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0d63d6;
}

.success{
    display:none;
    margin-top:25px;
    padding:15px;
    background:#d4edda;
    color:#155724;
    border-radius:8px;
    text-align:center;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">
<h1>PingCar</h1>
<p>Sie haben dieses Fahrzeug gefunden?</p>
</div>

<label>Ihr Name</label>

<input
type="text"
id="name"
placeholder="Ihr Name">

<label>Telefon (optional)</label>

<input
type="text"
id="phone"
placeholder="+41...">

<label>Ihre Nachricht</label>

<textarea
id="message"
placeholder="Beschreiben Sie das Problem..."></textarea>

<label>Foto hochladen (optional)</label>

<input
type="file"
id="photo">

<button id="sendMessage">
Nachricht senden
</button>

<div
class="success"
id="successBox">

Vielen Dank!<br><br>

Ihre Nachricht wurde erfolgreich an den Fahrzeughalter gesendet.

</div>
<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
"https://uvmkhqzfsgvicacvgskf.supabase.co",
"sb_publishable_PlgGThtv9ZEPqgiag8Y7Gw_PvZwsij2"
);

const params = new URLSearchParams(window.location.search);

const pingId = params.get("id");

document.getElementById("sendMessage").addEventListener("click", async () => {

const senderName = document.getElementById("name").value;

const senderPhone = document.getElementById("phone").value;

const senderMessage = document.getElementById("message").value;

if(senderName==="" || senderMessage===""){

alert("Bitte alle Pflichtfelder ausfüllen.");

return;

}

const { error } = await supabase

.from("messages")

.insert([

{

owner_ping_id: pingId,

sender_name: senderName,

sender_phone: senderPhone,

message: senderMessage

}

]);

if(error){

alert(error.message);

return;

}

document.getElementById("successBox").style.display="block";

document.getElementById("name").value="";

document.getElementById("phone").value="";

document.getElementById("message").value="";

});

</script>
</div>

</body>
</html>
