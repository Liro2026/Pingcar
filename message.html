<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PingCar - Nachricht senden</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6fb;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    border-radius:15px;
    padding:35px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#1877f2;
    font-size:38px;
}

.logo p{
    color:#666;
    margin-top:10px;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    resize:vertical;
    min-height:140px;
}

input[type=file]{
    border:none;
    padding:0;
    margin-top:10px;
}

button{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0d63d6;
}

.success{
    display:none;
    margin-top:25px;
    padding:15px;
    background:#d4edda;
    color:#155724;
    border-radius:8px;
    text-align:center;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">
<h1>PingCar</h1>
<p id="pageSubtitle">Sie haben dieses Fahrzeug gefunden?</p>
</div>

<label id="nameLabel">Ihr Name</label>

<input
type="text"
id="name"
placeholder="Ihr Name">

<label id="phoneLabel">Telefon (optional)</label>

<input
type="text"
id="phone"
placeholder="+41...">

<label id="messageLabel">Ihre Nachricht</label>

<textarea
id="message"
placeholder="Beschreiben Sie das Problem..."></textarea>

<label id="photoLabel">Foto hochladen (optional)</label>

<input
type="file"
id="photo">

<button id="sendMessage">
Nachricht senden
</button>

<div
class="success"
id="successBox">

<span id="successText">
Vielen Dank!<br><br>
Ihre Nachricht wurde erfolgreich an den Fahrzeughalter gesendet.
</span>

</div>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
"https://uvmkhqzfsgvicacvgskf.supabase.co",
"sb_publishable_PlgGThtv9ZEPqgiag8Y7Gw_PvZwsij2"
);

const params = new URLSearchParams(window.location.search);
const pingId = params.get("id");


/* =========================
   LANGUAGE SYSTEM
========================= */

const translations = {

de: {

    subtitle: "Sie haben dieses Fahrzeug gefunden?",
    name: "Ihr Name",
    namePlaceholder: "Ihr Name",

    message: "Ihre Nachricht",
    messagePlaceholder: "Beschreiben Sie das Problem...",
    photo: "Foto hochladen (optional)",

    required: "Bitte alle Pflichtfelder ausfüllen.",
    error: "Fehler"
},

fr: {
    title: "PingCar - Envoyer un message",
    subtitle: "Vous avez trouvé ce véhicule ?",
    name: "Votre nom",
    namePlaceholder: "Votre nom",
    phone: "Téléphone (facultatif)",
    message: "Votre message",
    messagePlaceholder: "Décrivez le problème...",
    photo: "Télécharger une photo (facultatif)",
    send: "Envoyer le message",
    success: "Merci !|Votre message a été envoyé avec succès au propriétaire du véhicule.",
    required: "Veuillez remplir tous les champs obligatoires.",
    error: "Erreur"
},

it: {
    title: "PingCar - Invia messaggio",
    subtitle: "Hai trovato questo veicolo?",
    name: "Il tuo nome",
    namePlaceholder: "Il tuo nome",
    phone: "Telefono (facoltativo)",
    message: "Il tuo messaggio",
    messagePlaceholder: "Descrivi il problema...",
    photo: "Carica una foto (facoltativo)",
    send: "Invia messaggio",
    success: "Grazie!|Il tuo messaggio è stato inviato con successo al proprietario del veicolo.",
    required: "Compila tutti i campi obbligatori.",
    error: "Errore"
},

en: {
    title: "PingCar - Send Message",
    subtitle: "Have you found this vehicle?",
    name: "Your name",
    namePlaceholder: "Your name",
    phone: "Phone (optional)",
    message: "Your message",
    messagePlaceholder: "Describe the problem...",
    photo: "Upload photo (optional)",
    send: "Send message",
    success: "Thank you!|Your message was successfully sent to the vehicle owner.",
    required: "Please fill in all required fields.",
    error: "Error"
},

sq: {
    title: "PingCar - Dërgo mesazh",
    subtitle: "A e keni gjetur këtë automjet?",
    name: "Emri juaj",
    namePlaceholder: "Emri juaj",
    phone: "Telefoni (opsionale)",
    message: "Mesazhi juaj",
    messagePlaceholder: "Përshkruani problemin...",
    photo: "Ngarko foto (opsionale)",
    send: "Dërgo mesazhin",
    success: "Faleminderit!|Mesazhi juaj u dërgua me sukses te pronari i automjetit.",
    required: "Ju lutemi plotësoni të gjitha fushat e detyrueshme.",
    error: "Gabim"
}

};


/* =========================
   GET SELECTED LANGUAGE
========================= */

function getLanguage(){

    const possibleKeys = [
        "language",
        "lang",
        "selectedLanguage",
        "pingcar_language"
    ];

    for(const key of possibleKeys){

        const value = localStorage.getItem(key);

        if(value && translations[value]){
            return value;
        }

    }

    return "de";
}


/* =========================
   APPLY LANGUAGE
========================= */

function applyLanguage(){

    const lang = getLanguage();
    const t = translations[lang];

    document.documentElement.lang = lang;

    document.title = t.title;

    document.getElementById("pageSubtitle").textContent = t.subtitle;

    document.getElementById("nameLabel").textContent = t.name;
    document.getElementById("name").placeholder = t.namePlaceholder;

    document.getElementById("phoneLabel").textContent = t.phone;

    document.getElementById("messageLabel").textContent = t.message;
    document.getElementById("message").placeholder = t.messagePlaceholder;

    document.getElementById("photoLabel").textContent = t.photo;

    document.getElementById("sendMessage").textContent = t.send;

    const successParts = t.success.split("|");

    document.getElementById("successText").innerHTML =
        successParts[0] +
        "<br><br>" +
        successParts[1];
}


/* Apply language when page loads */
applyLanguage();


/* Also react if language changes in another PingCar page */
window.addEventListener("storage", applyLanguage);


/* =========================
   SEND MESSAGE
========================= */

document.getElementById("sendMessage").addEventListener("click", async () => {

const lang = getLanguage();
const t = translations[lang];

const senderName =
document.getElementById("name").value;

const senderPhone =
document.getElementById("phone").value;

const senderMessage =
document.getElementById("message").value;

if(senderName==="" || senderMessage===""){

alert(t.required);

return;

}

const { error } = await supabase
.from("notifications")
.insert([
{
    qr_code: pingId,
    message: senderMessage,
    sender_id: "anonymous"
}
]);

if(error){

alert(t.error + ": " + error.message);

return;

}

document.getElementById("successBox").style.display="block";

document.getElementById("name").value="";

document.getElementById("phone").value="";

document.getElementById("message").value="";

});

</script>

</div>

</body>
</html>
