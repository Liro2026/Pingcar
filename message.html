<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PingCar Chat</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6fb;
}

.container{
  max-width:700px;
  margin:30px auto;
  background:white;
  border-radius:15px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  margin-bottom:20px;
}

.logo h1{
  color:#1877f2;
  font-size:36px;
}

.logo p{
  color:#666;
  margin-top:8px;
}

.chat-box{
  height:420px;
  overflow-y:auto;
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  background:#f8f9fc;
}

.message{
  margin-bottom:12px;
  padding:12px 15px;
  border-radius:12px;
  max-width:80%;
  word-wrap:break-word;
}

.mine{
  margin-left:auto;
  background:#1877f2;
  color:white;
}

.theirs{
  margin-right:auto;
  background:#e9ecef;
  color:#222;
}

.message-time{
  font-size:11px;
  margin-top:5px;
  opacity:.7;
}

.input-area{
  margin-top:15px;
}

textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#1877f2;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0d63d6;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  margin-top:12px;
  text-align:center;
  font-size:14px;
  color:#666;
}

.error{
  color:#c62828;
}

.success{
  color:#16803c;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>PingCar</h1>
    <p id="chatTitle">PingCar Chat</p>
  </div>

  <div id="chatBox" class="chat-box">
    <div class="status" id="loading">
      Nachrichten werden geladen...
    </div>
  </div>

  <div class="input-area">

    <textarea
      id="messageInput"
      placeholder="Ihre Nachricht..."
    ></textarea>

    <button id="sendButton">
      Nachricht senden
    </button>

    <div id="status" class="status"></div>

  </div>

</div>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
"https://uvmkhqzfsgvicacvgskf.supabase.co",
"sb_publishable_PlgGThtv9ZEpQgiag8Y7Gw_PvZwsij2"
);


/* =========================
   URL PARAMETER
========================= */

const params =
  new URLSearchParams(window.location.search);

const conversationId =
  params.get("conversation_id");

const receiverId =
  params.get("receiver_id");

const qrCode =
  params.get("qr_code");


/* =========================
   LANGUAGE
========================= */

const translations = {

  de:{
    title:"PingCar Chat",
    loading:"Nachrichten werden geladen...",
    placeholder:"Ihre Nachricht...",
    send:"Nachricht senden",
    sent:"Nachricht erfolgreich gesendet.",
    limit:"Sie haben Ihr Limit von 5 Nachrichten innerhalb von 24 Stunden erreicht.",
    error:"Fehler",
    empty:"Noch keine Nachrichten.",
    missing:"Chat-Parameter fehlen."
  },

  fr:{
    title:"PingCar Chat",
    loading:"Chargement des messages...",
    placeholder:"Votre message...",
    send:"Envoyer le message",
    sent:"Message envoyé avec succès.",
    limit:"Vous avez atteint votre limite de 5 messages en 24 heures.",
    error:"Erreur",
    empty:"Aucun message pour le moment.",
    missing:"Paramètres du chat manquants."
  },

  it:{
    title:"PingCar Chat",
    loading:"Caricamento dei messaggi...",
    placeholder:"Il tuo messaggio...",
    send:"Invia messaggio",
    sent:"Messaggio inviato con successo.",
    limit:"Hai raggiunto il limite di 5 messaggi in 24 ore.",
    error:"Errore",
    empty:"Nessun messaggio.",
    missing:"Parametri della chat mancanti."
  },

  en:{
    title:"PingCar Chat",
    loading:"Loading messages...",
    placeholder:"Your message...",
    send:"Send message",
    sent:"Message sent successfully.",
    limit:"You have reached your limit of 5 messages within 24 hours.",
    error:"Error",
    empty:"No messages yet.",
    missing:"Chat parameters are missing."
  },

  sq:{
    title:"PingCar Chat",
    loading:"Mesazhet po ngarkohen...",
    placeholder:"Mesazhi juaj...",
    send:"Dërgo mesazhin",
    sent:"Mesazhi u dërgua me sukses.",
    limit:"Keni arritur kufirin prej 5 mesazhesh brenda 24 orëve.",
    error:"Gabim",
    empty:"Ende nuk ka mesazhe.",
    missing:"Mungojnë parametrat e chat-it."
  },
  
sr:{
  title:"PingCar Chat",
  loading:"Učitavanje poruka...",
  placeholder:"Vaša poruka...",
  send:"Pošalji poruku",
  sent:"Poruka je uspešno poslata.",
  limit:"Dostigli ste ograničenje od 5 poruka u roku od 24 sata.",
  error:"Greška",
  empty:"Još nema poruka.",
  missing:"Nedostaju parametri za chat."
},
  es:{
  title:"PingCar Chat",
  loading:"Cargando mensajes...",
  placeholder:"Su mensaje...",
  send:"Enviar mensaje",
  sent:"Mensaje enviado correctamente.",
  limit:"Ha alcanzado el límite de 5 mensajes en 24 horas.",
  error:"Error",
  empty:"Todavía no hay mensajes.",
  missing:"Faltan los parámetros del chat."
},
  tr:{
    title:"PingCar Chat",
    loading:"Mesajlar yükleniyor...",
    placeholder:"Mesajınız...",
    send:"Mesaj gönder",
    sent:"Mesaj başarıyla gönderildi.",
    limit:"24 saat içinde 5 mesajlık sınırınıza ulaştınız.",
    error:"Hata",
    empty:"Henüz mesaj yok.",
    missing:"Sohbet parametreleri eksik."
},
sk: {
  title: "PingCar Chat",
  loading: "Načítavajú sa správy...",
  placeholder: "Vaša správa...",
  send: "Odoslať správu",
  sent: "Správa bola úspešne odoslaná.",
  limit: "Dosiahli ste limit 5 správ za 24 hodín.",
  error: "Chyba",
  empty: "Zatiaľ žiadne správy.",
  missing: "Chýbajú parametre chatu."
},
hr: {

  title: "PingCar Chat",

  loading: "Učitavanje poruka...",

  placeholder: "Vaša poruka...",

  send: "Pošalji poruku",

  sent: "Poruka je uspješno poslana.",

  limit: "Dosegnuli ste ograničenje od 5 poruka u 24 sata.",

  error: "Greška",

  empty: "Još nema poruka.",

  missing: "Nedostaju parametri chata."

}

};


function getLanguage(){

  const keys = [
    "pingcar_language",
    "language",
    "lang",
    "selectedLanguage"
  ];

  for(const key of keys){

    const value =
      localStorage.getItem(key);

    if(value && translations[value]){
      return value;
    }
  }

  return "de";
}


const lang = getLanguage();
const t = translations[lang];

document.documentElement.lang = lang;
document.title = t.title;

document.getElementById(
  "chatTitle"
).textContent = t.title;

document.getElementById(
  "messageInput"
).placeholder = t.placeholder;

document.getElementById(
  "sendButton"
).textContent = t.send;

document.getElementById(
  "loading"
).textContent = t.loading;


/* =========================
   CLIENT ID
========================= */

let clientId =
  localStorage.getItem("pingcar_client_id");

if(!clientId){

  clientId = crypto.randomUUID();

  localStorage.setItem(
    "pingcar_client_id",
    clientId
  );
}


/* =========================
   CURRENT USER
========================= */

let currentUser = null;
let activeSenderId = null;

async function initializeUser(){

  const { data } =
    await supabase.auth.getUser();

  currentUser = data?.user || null;

  /*
   * Nëse pronari është i kyçur,
   * përdorim UUID e account-it.
   *
   * Nëse është personi që ka skanuar QR,
   * përdorim client_id anonim.
   */

  activeSenderId =
    currentUser?.id || clientId;

}


/* =========================
   CHECK PARAMETERS
========================= */

if(
  !conversationId ||
  !receiverId ||
  !qrCode
){

  document.getElementById(
    "chatBox"
  ).innerHTML =
    `<div class="status error">
      ${t.missing}
    </div>`;

  document.getElementById(
    "sendButton"
  ).disabled = true;
}


/* =========================
   LOAD CHAT
========================= */

async function loadMessages(){

  if(
    !conversationId ||
    !activeSenderId
  ){
    return;
  }

  const { data, error } =
    await supabase.rpc(
      "get_pingcar_chat_messages",
      {
        p_conversation_id:
          conversationId,

        p_user_id:
          activeSenderId
      }
    );

  const box =
    document.getElementById("chatBox");

  if(error){

    console.error(
      "Chat load error:",
      error
    );

    box.innerHTML =
      `<div class="status error">
        ${t.error}: ${error.message}
      </div>`;

    return;
  }

  if(!data || data.length === 0){

    box.innerHTML =
      `<div class="status">
        ${t.empty}
      </div>`;

    return;
  }

  box.innerHTML = "";

  data.forEach(msg => {

    const div =
      document.createElement("div");

    const isMine =
      msg.sender_id === activeSenderId;

    div.className =
      "message " +
      (isMine ? "mine" : "theirs");

    const text =
      document.createElement("div");

    text.textContent =
      msg.message || "";

    const time =
      document.createElement("div");

    time.className =
      "message-time";

    time.textContent =
      msg.created_at
        ? new Date(
            msg.created_at
          ).toLocaleString(
            lang === "de"
              ? "de-CH"
              : lang
          )
        : "";

    div.appendChild(text);
    div.appendChild(time);

    box.appendChild(div);

  });

  box.scrollTop =
    box.scrollHeight;
}


/* =========================
   SEND CHAT MESSAGE
========================= */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    input.value.trim();

  const statusBox =
    document.getElementById(
      "status"
    );

  if(!message){
    return;
  }

  if(
    !conversationId ||
    !receiverId ||
    !qrCode ||
    !activeSenderId
  ){

    statusBox.textContent =
      t.missing;

    statusBox.className =
      "status error";

    return;
  }

  const button =
    document.getElementById(
      "sendButton"
    );

  button.disabled = true;

  try{

    const { data, error } =
      await supabase.rpc(
        "send_pingcar_chat_message",
        {
          p_conversation_id:
            conversationId,

          p_sender_id:
            activeSenderId,

          p_receiver_id:
            receiverId,

          p_qr_code:
            qrCode,

          p_message:
            message
        }
      );

    if(error){

      console.error(
        "Chat send error:",
        error
      );

      statusBox.textContent =
        t.error +
        ": " +
        error.message;

      statusBox.className =
        "status error";

      return;
    }

    if(!data || !data.allowed){

      statusBox.textContent =
        t.limit;

      statusBox.className =
        "status error";

      return;
    }

    input.value = "";

    statusBox.textContent =
      t.sent +
      " (" +
      data.remaining +
      ")";

    statusBox.className =
      "status success";

    await loadMessages();

  }
  catch(error){

    console.error(error);

    statusBox.textContent =
      t.error;

    statusBox.className =
      "status error";

  }
  finally{

    button.disabled = false;

  }
}


/* =========================
   SEND BUTTON
========================= */

document
.getElementById("sendButton")
.addEventListener(
  "click",
  sendMessage
);


/* =========================
   CTRL + ENTER
========================= */

document
.getElementById("messageInput")
.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      event.ctrlKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   START
========================= */

await initializeUser();

await loadMessages();


/* =========================
   AUTO REFRESH
========================= */

setInterval(
  loadMessages,
  5000
);

</script>

</body>
</html>
