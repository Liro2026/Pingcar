<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingCar QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- PingCar QR deployment update -->
<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}
#reader{
    width:320px;
    margin:20px auto;
}
</style>

</head>
<body>

<h2 id="qrTitle">📱 QR-Code Scanner</h2>

<div id="reader"></div>
<script>
const qrLang = localStorage.getItem("pingcar_language") || "de";

const qrTranslations = {
  de: "📱 QR-Code Scanner",
  fr: "📱 Scanner de code QR",
  it: "📱 Scanner di codici QR",
  en: "📱 QR-Code Scanner",
  sq: "📱 Skaneri i kodit QR"
};

document.getElementById("qrTitle").textContent =
  qrTranslations[qrLang] || qrTranslations.de;
</script>
<script>

var supabase = window.supabase.createClient(
"https://uvmkhqzfsgvicacvgskf.supabase.co",
"sb_publishable_PlgGThtv9ZEpQgiag8Y7Gw_PvZwsij2"
);

async function onScanSuccess(decodedText){

const { data, error } = await supabase
.from("cars")
.select("qr_code")
.eq("qr_code", decodedText.trim())
.maybeSingle();

if (error) {
    alert(JSON.stringify(error));
    return;
}

if (!data) {
    alert("Nuk ka data");
    return;
}
window.location.href = "contact.html?id=" + data.qr_code;
return;


}

const scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: 250
    },
    false
);

scanner.render(onScanSuccess);

</script>

</body>
</html>
