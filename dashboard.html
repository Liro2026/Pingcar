<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingCar Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:30px;
}

.card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0b7cff;
}

.info{
    font-size:20px;
    margin:15px 0;
}

img{
    width:220px;
    display:block;
    margin:20px auto;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0b7cff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#095fd1;
}
</style>

</head>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";
const supabase = createClient(
  "https://uvmkhqzfsgvicacvgskf.supabase.co",

  "sb_publishable_PlgGThtv9ZEpQgiag8Y7Gw_PvZwsij2"
);
const firebaseConfig = {
  apiKey: "AIzaSyAXvR0zRSjUWwLp40qovq2iNlt9g0ISw7Y",
  authDomain: "pingcar.firebaseapp.com",
  projectId: "pingcar",
  storageBucket: "pingcar.firebasestorage.app",
  messagingSenderId: "133178961912",
  appId: "1:133178961912:web:f41ed6b0b381ec69d7b00d"
};

const firebaseApp = initializeApp(firebaseConfig);
const messaging = getMessaging(firebaseApp);

const VAPID_KEY = "BHOqSOw3efNqpGHgyuhD_Nlf05uGPiQGcuTv6xjHAkHWAsaG0daK6XrmwE3sPNmgN6pC62sqcBFb6RasKhcD2bE";

const registration = await navigator.serviceWorker.register(
  "/firebase-messaging-sw.js"
);

const permission = await Notification.requestPermission();

if (permission === "granted") {
  const token = await getToken(messaging, {
    vapidKey: VAPID_KEY,
    serviceWorkerRegistration: registration
  });

  console.log("PINGCAR DEVICE TOKEN:", token);
}
// Kontrollo përdoruesin
const {
  data: { user },
} = await supabase.auth.getUser();

if (!user) {
  location.href = "index.html";
}

// Merr Ping ID dhe QR Code
const { data, error } = await supabase
  .from("user_qr")
  .select("*")
  .eq("user_id", user.id)
  .single();

if (!error && data) {
  document.getElementById("pingid").innerText = data.ping_id;

  if (data.qr_code) {
  
    document.getElementById("qrimage").src = data.qr_code;

  }
}

// Logout
document.getElementById("logout").onclick = async () => {
  await supabase.auth.signOut();
  location.href = "index.html";
};
</script>
<body>

<div class="card">

<h1>PingCar Dashboard</h1>

<div class="info">
<b>Ping ID:</b>
<span id="pingid">...</span>
</div>

<div class="info">
<b>Premium:</b>
<span id="premium">Aktiv</span>
</div>

<img id="qrimage">
<button id="enablePush" type="button">
🔔 Benachrichtigungen aktivieren
</button>
<button id="logout">
Logout
</button>
<hr style="margin:35px 0;">

<h2>📩 Neue Nachrichten</h2>

<div id="messageList">

<p>Keine Nachrichten vorhanden.</p>

</div>
</div>

</body>
</html>
