<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingCar Dashboard</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:30px}
.card{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.15)}
h1{text-align:center;color:#0b7cff}
.info{font-size:20px;margin:15px 0}
img{width:220px;display:block;margin:20px auto}
button{width:100%;padding:15px;border:none;border-radius:10px;background:#0b7cff;color:#fff;font-size:18px;cursor:pointer;margin-top:8px}
button:hover{background:#095fd1}
button:disabled{opacity:.65;cursor:not-allowed}
#pushStatus{margin-top:12px;padding:10px;border-radius:8px;display:none}
.status-ok{background:#e8f7ed;color:#176b35}
.status-error{background:#fdecec;color:#a11a1a}
.status-info{background:#eef5ff;color:#164b8a}
</style>
</head>
<body>
<div class="card">
<h1>PingCar Dashboard</h1>
<div class="info"><b>Ping ID:</b> <span id="pingid">...</span></div>
<div class="info"><b>Premium:</b> <span id="premium">Aktiv</span></div>
<img id="qrimage" alt="QR Code" style="display:none">
<button id="enablePush" type="button">🔔 Benachrichtigungen aktivieren</button>
<div id="pushStatus"></div>
<button id="logout" type="button">Logout</button>
<hr style="margin:35px 0;">
<h2>📩 Neue Nachrichten</h2>
<div id="messageList"><p>Keine Nachrichten vorhanden.</p></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";

const SUPABASE_URL = "https://uvmkhqzfsgvicacvgskf.supabase.co";
const SUPABASE_KEY = "sb_publishable_PlgGThtv9ZEpQgiag8Y7Gw_PvZwsij2";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const firebaseConfig = {
  apiKey: "AIzaSyComGzTg8b2WRRyzFLt7yt__eD9FRQCbrY",
  authDomain: "pingcar.firebaseapp.com",
  projectId: "pingcar",
  storageBucket: "pingcar.firebasestorage.app",
  messagingSenderId: "133178961912",
  appId: "1:133178961912:web:f41ed6b0b381ec69d7b00d"
};

const VAPID_KEY = "BHOqSOw3efNqpGHgyuhD_Nlf05uGPiQGcuTv6xjHAkHWAsaG0daK6XrmwE3sPNmgN6pC62sqcBFb6RasKhcD2bE";

const pushButton = document.getElementById("enablePush");
const pushStatus = document.getElementById("pushStatus");

function showStatus(message, type = "info") {
  pushStatus.textContent = message;
  pushStatus.className = "status-" + type;
  pushStatus.style.display = "block";
}

let currentUser = null;

// Push listener is attached immediately. Firebase is initialized only after the click,
// so an initialization problem cannot silently prevent the button from working.
pushButton.addEventListener("click", async () => {
  pushButton.disabled = true;
  showStatus("Push-Nachrichten werden aktiviert ...", "info");

  try {
    if (!window.isSecureContext) {
      throw new Error("Diese Seite muss über HTTPS geöffnet werden.");
    }

    if (!("serviceWorker" in navigator)) {
      throw new Error("Dieser Browser unterstützt keine Service Worker.");
    }

    if (!("Notification" in window)) {
      throw new Error("Dieser Browser unterstützt keine Browser-Benachrichtigungen.");
    }

    if (!currentUser) {
      const { data, error } = await supabase.auth.getUser();
      if (error) throw error;
      currentUser = data.user;
    }

    if (!currentUser) {
      location.href = "index.html";
      return;
    }

    const supported = await isSupported();
    if (!supported) {
      throw new Error("Firebase Cloud Messaging wird in diesem Browser nicht unterstützt.");
    }

    const permission = await Notification.requestPermission();
    if (permission !== "granted") {
      showStatus("Die Benachrichtigungen wurden nicht erlaubt.", "error");
      return;
    }

    const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js", { scope: "./" });
    await navigator.serviceWorker.ready;

    const firebaseApp = initializeApp(firebaseConfig);
    const messaging = getMessaging(firebaseApp);

    const token = await getToken(messaging, {
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: registration
    });

    if (!token) {
      throw new Error("Firebase hat keinen Device-Token zurückgegeben.");
    }

    console.log("PINGCAR DEVICE TOKEN:", token);

    // Save the token for this logged-in user.
    const { data: existing, error: findError } = await supabase
      .from("device_tokens")
      .select("id,fcm_token")
      .eq("user_id", currentUser.id)
      .eq("fcm_token", token)
      .maybeSingle();

    if (findError) throw new Error("Device-Token konnte nicht geprüft werden: " + findError.message);

    if (!existing) {
      const { error: insertError } = await supabase
        .from("device_tokens")
        .insert({ user_id: currentUser.id, fcm_token: token });

      if (insertError) throw new Error("Device-Token konnte nicht gespeichert werden: " + insertError.message);
    }

    showStatus("Njoftimet u aktivizuan dhe Device-Token u ruajt.", "ok");
    alert("Njoftimet u aktivizuan!");
  } catch (error) {
    console.error("PingCar Push error:", error);
    showStatus("Fehler: " + (error?.message || error), "error");
    alert("Gabim gjatë aktivizimit të njoftimeve. Shiko mesazhin poshtë butonit.");
  } finally {
    pushButton.disabled = false;
  }
});

async function loadDashboard() {
  const { data, error } = await supabase.auth.getUser();
  if (error) {
    console.error("Supabase auth error:", error);
    location.href = "index.html";
    return;
  }

  currentUser = data.user;
  if (!currentUser) {
    location.href = "index.html";
    return;
  }

  const { data: qrData, error: qrError } = await supabase
    .from("user_qr")
    .select("ping_id,qr_code")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if (qrError) {
    console.error("Ping ID error:", qrError);
  }

  if (qrData) {
    document.getElementById("pingid").textContent = qrData.ping_id || "...";
    if (qrData.qr_code) {
      const qrImage = document.getElementById("qrimage");
      qrImage.src = qrData.qr_code;
      qrImage.style.display = "block";
    }
  }
}

document.getElementById("logout").addEventListener("click", async () => {
  await supabase.auth.signOut();
  location.href = "index.html";
});

loadDashboard();
</script>
</body>
</html>
