/* ===== PingCar Modern Dashboard ===== */

body {
  background: #f3f7fb !important;
  color: #172033;
}

.top {
  background: linear-gradient(135deg, #1762d2, #08a9e8) !important;
  box-shadow: 0 4px 18px rgba(0,0,0,.12);
}

.card {
  background: #ffffff;
  border-radius: 18px;
  box-shadow: 0 4px 16px rgba(0,0,0,.08);
  margin-bottom: 18px;
}

.btn {
  border-radius: 10px;
  transition: .2s;
}

.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(0,0,0,.12);
}

.status {
  border-radius: 10px;
}

.notice {
  background: #f7f9fc;
  border-left: 4px solid #1762d2;
  border-radius: 8px;
  padding: 12px;
  margin-top: 10px;
}
#notifications {
  margin-top: 12px;
  padding: 14px;
  border-radius: 12px;
  background: #f7f9fc;
  border: 1px solid #e2e8f0;
  color: #172033;
}

#notifications > div {
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 8px;
  background: #ffffff;
  border-left: 4px solid #1762d2;
}

#notifications > div:last-child {
  margin-bottom: 0;
}
</style>
</head>

function translateDashboard() {
  const translations = dashTranslations[dashLang] || dashTranslations.de;

  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT
  );

  let node;

  while (node = walker.nextNode()) {
    const original = node.nodeValue.trim();

    if (translations[original]) {
      node.nodeValue = node.nodeValue.replace(
        original,
        translations[original]
      );
    }
  }
}

document.addEventListener("DOMContentLoaded", translateDashboard);

async function loadNotifications(user) {

function replyToPingCar(conversationId, senderId, qrCode) {

function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])); }

async function enablePush() {
  try {
    if (!currentUser) { status("Du bist nicht angemeldet.", "error"); return; }
    if (!("serviceWorker" in navigator) || !("Notification" in window)) { status("Dieser Browser unterstützt Push-Benachrichtigungen hier nicht.", "error"); return; }

    status("Firebase wird geladen...");
    const [{ initializeApp }, { getMessaging, getToken }] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js")
    ]);

    const firebaseApp = initializeApp(FIREBASE_CONFIG);
    const messaging = getMessaging(firebaseApp);

    status("Service Worker wird registriert...");
    const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js", {scope:"./"});
    await navigator.serviceWorker.ready;

    const permission = await Notification.requestPermission();
    if (permission !== "granted") { status("Benachrichtigungen wurden nicht erlaubt.", "error"); return; }

    status("FCM Token wird erstellt...");
    const token = await getToken(messaging, {vapidKey: VAPID_KEY, serviceWorkerRegistration: registration});
    if (!token) throw new Error("Firebase hat keinen FCM Token zurückgegeben.");

    const { error } = await supabase.from("device_tokens").upsert({user_id: currentUser.id, fcm_token: token}, {onConflict:"user_id"});
    if (error) throw new Error("Token konnte nicht in Supabase gespeichert werden: " + error.message);

    console.log("PINGCAR DEVICE TOKEN:", token);
    status("✅ Benachrichtigungen sind aktiviert und der Geräte-Token wurde gespeichert.", "success");
  } catch (error) {
    console.error("PINGCAR PUSH ERROR:", error);
    status("❌ Push-Fehler:\n" + (error?.message || String(error)), "error");
  }
}

async function downloadQR() {
  const qrImage = document.querySelector('img[alt="PingCar QR-Code"]');

  if (!qrImage || !qrImage.src) {
    alert("QR-Code konnte nicht gefunden werden.");
    return;
  }

  try {
    const response = await fetch(qrImage.src);

    if (!response.ok) {
      throw new Error("QR-Code konnte nicht geladen werden.");
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "PingCar-QR-Code.png";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
  } catch (error) {
    console.error("QR-Code Download-Fehler:", error);
    alert("Der QR-Code konnte nicht heruntergeladen werden.");
  }
}
function printQR() {
    saveQRAsPDF();
}

async function shareQR() {
    const qrimage = document.getElementById("qrimage");

    if (!qrimage || !qrimage.src) {
        alert("QR-Code konnte nicht gefunden werden.");
        return;
    }

    try {
        if (navigator.share) {
            await navigator.share({
                title: "Mein PingCar QR-Code",
                text: "Mein PingCar QR-Code",
                url: window.location.origin + "/qr.html"
            });
        } else {
            await navigator.clipboard.writeText(
                window.location.origin + "/qr.html"
            );

            alert("QR-Code-Link wurde kopiert.");
        }
    } catch (error) {
        console.log("Teilen abgebrochen:", error);
    }
}
