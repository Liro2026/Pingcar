<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingCar Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:30px;
}

.card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0b7cff;
}

.info{
    font-size:20px;
    margin:15px 0;
}

img{
    width:220px;
    display:block;
    margin:20px auto;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0b7cff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#095fd1;
}
</style>

</head>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://uvmkhqzfsgvicacvgskf.supabase.co",

  "sb_publishable_PlgGThtv9ZEpQgiag8Y7Gw_PvZwsij2"
);

// Kontrollo përdoruesin
const {
  data: { user },
} = await supabase.auth.getUser();

if (!user) {
  location.href = "index.html";
}

// Merr Ping ID dhe QR Code
const { data, error } = await supabase
  .from("user_qr")
  .select("*")
  .eq("user_id", user.id)
  .single();

if (!error && data) {
  document.getElementById("pingid").innerText = data.ping_id;

  if (data.qr_code) {
    document.getElementById("qrimage").src = data.qr_code;
  }
}

// Logout
document.getElementById("logout").onclick = async () => {
  await supabase.auth.signOut();
  location.href = "index.html";
};
</script>
<body>

<div class="card">

<h1>PingCar Dashboard</h1>

<div class="info">
<b>Ping ID:</b>
<span id="pingid">...</span>
</div>

<div class="info">
<b>Premium:</b>
<span id="premium">Aktiv</span>
</div>

<img id="qrimage">

<button id="logout">
Logout
</button>

</div>

</body>
</html>
