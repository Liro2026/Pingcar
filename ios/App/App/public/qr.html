<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingCar QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;text-align:center;padding:20px}
#reader{width:320px;margin:20px auto}
</style>
</head>
<body>

<h2 id="qrTitle">📱 QR-Code Scanner</h2>
<div id="reader"></div>

<script>
const supabase = window.supabase.createClient(
  "https://uvmkhqzfsgvicacvgskf.supabase.co",
  "sb_publishable_PlgGThtv9ZEpQgiag8Y7Gw_PvZwsij2"
);

let busy = false;

async function onScanSuccess(decodedText){
  if(busy) return;
  busy = true;

  const code = decodedText.trim();

  const { data, error } = await supabase
    .from("cars")
    .select("qr_code")
    .eq("qr_code", code)
    .maybeSingle();

  if(error){
    alert(error.message);
    busy = false;
    return;
  }

  if(!data){
    alert("QR Code nuk u gjet.");
    busy = false;
    return;
  }

  window.location.href = "contact.html?id=" + encodeURIComponent(data.qr_code);
}

function onScanFailure(error){}

const scanner = new Html5QrcodeScanner(
  "reader",
  { fps:10, qrbox:250 }
);

scanner.render(onScanSuccess, onScanFailure);
</script>

</body>
</html>
